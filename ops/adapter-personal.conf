[Service]
LoadCredential=
LoadCredential=state_key:/etc/feishu-dot/credentials/state_key
LoadCredential=feishu_app_secret:/etc/feishu-dot/credentials/feishu_app_secret
LoadCredential=local_mcp_auth:/etc/feishu-dot/credentials/local_mcp_auth
ExecStart=
ExecStart=/opt/apps/feishu-dot-adapter/.venv/bin/python -m deploy.run --auth-mode tunnel-single-user --config /etc/feishu-dot/config.json --run --credential-dir %d
