[Service]
LoadCredential=local_mcp_auth:/etc/feishu-dot/credentials/local_mcp_auth
ExecStart=
ExecStart=/opt/apps/feishu-dot-adapter/bin/tunnel-client run --profile avalon-feishu --profile-dir /etc/feishu-dot/tunnel --control-plane.api-key file:%d/control_plane_api_key --mcp.extra-headers "X-Feishu-Local-Auth: file:%d/local_mcp_auth" --mcp.discovery-extra-headers "X-Feishu-Local-Auth: file:%d/local_mcp_auth" --log.level warn
